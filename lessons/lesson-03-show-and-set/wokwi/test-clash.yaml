name: Quote cannot clash with silence/anthem
version: 1
author: STEM-93
steps:
  - wait-serial: 'Кнопки: A+B'
  - write-serial: "CLOCK OFF\n"
  - delay: 100ms
  - write-serial: "SET 2026-10-16 08:00:00\n"
  - delay: 300ms
  # A+B → меню 1/3, A+B → меню 2/3 (час не міняли)
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnB, control: pressed, value: 1 }
  - wait-serial: 'Меню 1/3'
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - delay: 40ms
  - set-control: { part-id: btnB, control: pressed, value: 0 }
  - delay: 300ms
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnB, control: pressed, value: 1 }
  - wait-serial: 'Меню 2/3'
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - delay: 40ms
  - set-control: { part-id: btnB, control: pressed, value: 0 }
  - delay: 300ms
  # години 09 → 12 (три натискання A)
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - delay: 150ms
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - delay: 150ms
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - wait-serial: 'меню: 12:00'
  # B → хвилини; утримання A до 12:09 (гімн 12:10 = час цитати)
  - set-control: { part-id: btnB, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnB, control: pressed, value: 0 }
  - wait-serial: 'змінюємо хвилини'
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - wait-serial: 'меню: 12:09'
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - delay: 300ms
  # A+B → має відмовити і лишитись у меню 2/3
  - set-control: { part-id: btnA, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btnB, control: pressed, value: 1 }
  - wait-serial: 'ПОМИЛКА: цитата не може збігатися'
  - set-control: { part-id: btnA, control: pressed, value: 0 }
  - delay: 40ms
  - set-control: { part-id: btnB, control: pressed, value: 0 }
  - delay: 1000ms
