<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 730" width="920" height="730" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Схема підключення уроку 2: урок 1 (Uno + DFPlayer Mini) + годинник DS3231 (I²C) -->
  <rect width="920" height="730" fill="#ffffff"/>
  <g transform="translate(60 0)">

  <!-- Arduino Uno -->
  <rect x="40" y="30" width="190" height="380" rx="10" fill="#1f6fa8"/>
  <text x="135" y="225" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Arduino</text>
  <text x="135" y="252" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Uno</text>
  <g fill="#ffffff" font-weight="bold" text-anchor="end">
    <text x="222" y="65">D7</text>
    <text x="222" y="115">5V</text>
    <text x="222" y="155">D11</text>
    <text x="222" y="195">D10</text>
    <text x="222" y="255">GND</text>
    <text x="222" y="385">GND</text>
  </g>

  <!-- DFPlayer Mini -->
  <rect x="520" y="70" width="240" height="350" rx="6" fill="#2b2b2b"/>
  <text x="640" y="92" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">DFPlayer Mini</text>
  <circle cx="532" cy="86" r="4" fill="#ffd54f"/>
  <!-- ліві виводи 1–8 -->
  <g fill="#ffffff" font-size="12">
    <text x="530" y="114">1 VCC</text>
    <text x="530" y="154">2 RX</text>
    <text x="530" y="194">3 TX</text>
    <text x="530" y="234" fill="#9e9e9e">4 DAC_R</text>
    <text x="530" y="274" fill="#9e9e9e">5 DAC_L</text>
    <text x="530" y="314">6 SPK_1</text>
    <text x="530" y="354" fill="#9e9e9e">7 GND</text>
    <text x="530" y="394">8 SPK_2</text>
  </g>
  <!-- праві виводи 16–9 -->
  <g fill="#ffffff" font-size="12" text-anchor="end" transform="translate(80 0)">
    <text x="670" y="114">BUSY 16</text>
    <text x="670" y="154" fill="#9e9e9e">USB− 15</text>
    <text x="670" y="194" fill="#9e9e9e">USB+ 14</text>
    <text x="670" y="234" fill="#9e9e9e">ADKEY_2 13</text>
    <text x="670" y="274" fill="#9e9e9e">ADKEY_1 12</text>
    <text x="670" y="314" fill="#9e9e9e">IO_2 11</text>
    <text x="670" y="354">GND 10</text>
    <text x="670" y="394" fill="#9e9e9e">IO_1 9</text>
  </g>
  <g fill="#c8a24a">
    <rect x="512" y="104" width="10" height="12"/><rect x="512" y="144" width="10" height="12"/>
    <rect x="512" y="184" width="10" height="12"/><rect x="512" y="224" width="10" height="12"/>
    <rect x="512" y="264" width="10" height="12"/><rect x="512" y="304" width="10" height="12"/>
    <rect x="512" y="344" width="10" height="12"/><rect x="512" y="384" width="10" height="12"/>
    <rect x="758" y="104" width="10" height="12"/><rect x="758" y="144" width="10" height="12"/>
    <rect x="758" y="184" width="10" height="12"/><rect x="758" y="224" width="10" height="12"/>
    <rect x="758" y="264" width="10" height="12"/><rect x="758" y="304" width="10" height="12"/>
    <rect x="758" y="344" width="10" height="12"/><rect x="758" y="384" width="10" height="12"/>
  </g>

  <!-- Дроти -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- D7 → BUSY (над модулем) -->
    <path d="M230 60 H810 V110 H768" stroke="#8e44ad"/>
    <!-- 5V → VCC -->
    <path d="M230 110 H512" stroke="#e53935"/>
    <!-- D11 → R1 → RX -->
    <path d="M230 150 H340" stroke="#fb8c00"/>
    <path d="M420 150 H512" stroke="#fb8c00"/>
    <!-- D10 → TX -->
    <path d="M230 190 H512" stroke="#2e7d32"/>
    <!-- GND → GND (вивід 10, під модулем) -->
    <path d="M230 250 H300 V470 H810 V350 H768" stroke="#212121"/>
    <!-- Динамік → SPK_1 / SPK_2 -->
    <path d="M512 310 H470 V328" stroke="#757575"/>
    <path d="M512 390 H470 V372" stroke="#757575"/>
  </g>

  <!-- Резистор 1 кОм -->
  <rect x="340" y="138" width="80" height="24" rx="5" fill="#f3e2c0" stroke="#8d6e63" stroke-width="2"/>
  <rect x="355" y="138" width="7" height="24" fill="#6d4c41"/>
  <rect x="370" y="138" width="7" height="24" fill="#212121"/>
  <rect x="385" y="138" width="7" height="24" fill="#e53935"/>
  <rect x="405" y="138" width="5" height="24" fill="#c9a227"/>
  <text x="380" y="128" font-weight="bold" fill="#bf360c" text-anchor="middle">R1 = 1 кОм</text>
  
  <!-- Динамік -->
  <rect x="455" y="328" width="30" height="44" rx="3" fill="#bdbdbd" stroke="#616161" stroke-width="2"/>
  <path d="M455 334 L425 318 V382 L455 366 Z" fill="#9e9e9e" stroke="#616161" stroke-width="2"/>
  <text x="440" y="405" font-size="12" text-anchor="middle">динамік 4–8 Ом, ≤3 Вт</text>


  <!-- Підписи до дротів -->
  <g font-size="12" fill="#424242">
    <text x="300" y="52">BUSY (вивід 16) → D7: LOW = трек грає</text>
    <text x="255" y="104">живлення 5V</text>
    <text x="255" y="184">TX модуля → D10</text>
    <text x="305" y="245">GND (можна вивід 7 або 10)</text>
  </g>

  </g>

  <!-- ===== Нове в уроці 2: DS3231 ===== -->
  <!-- Аналогові піни A4/A5 на справжній Uno — у нижньому лівому роз'ємі -->
  <g fill="#ffffff" font-weight="bold">
    <text x="108" y="335">A4 / SDA</text>
    <text x="108" y="375">A5 / SCL</text>
  </g>

  <!-- Модуль DS3231 -->
  <rect x="100" y="560" width="200" height="120" rx="8" fill="#283593"/>
  <text x="200" y="618" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">DS3231</text>
  <text x="200" y="638" fill="#c5cae9" font-size="12" text-anchor="middle">годинник реального часу</text>
  <circle cx="200" cy="662" r="11" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
  <text x="222" y="666" fill="#c5cae9" font-size="11">CR2032</text>
  <g fill="#ffffff" font-size="12" text-anchor="middle">
    <text x="140" y="580">SDA</text>
    <text x="180" y="580">SCL</text>
    <text x="220" y="580">VCC</text>
    <text x="260" y="580">GND</text>
  </g>
  <g fill="#c8a24a">
    <rect x="135" y="552" width="10" height="12"/><rect x="175" y="552" width="10" height="12"/>
    <rect x="215" y="552" width="10" height="12"/><rect x="255" y="552" width="10" height="12"/>
  </g>

  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- A4 → SDA -->
    <path d="M100 330 H55 V530 H140 V552" stroke="#1e88e5"/>
    <!-- A5 → SCL -->
    <path d="M100 370 H80 V515 H180 V552" stroke="#fdd835"/>
    <!-- 5V → VCC (відгалуження від лінії живлення DFPlayer) -->
    <path d="M320 110 V500 H220 V552" stroke="#e53935"/>
    <!-- GND → GND (від спільної «землі») -->
    <path d="M360 470 V540 H260 V552" stroke="#212121"/>
  </g>
  <circle cx="320" cy="110" r="6" fill="#e53935"/>
  <circle cx="360" cy="470" r="6" fill="#212121"/>

  <g font-size="12" fill="#424242">
    <text x="330" y="505">5V → VCC годинника</text>
    <text x="10" y="300">SDA (синій), SCL (жовтий) — шина I²C, адреса 0x68</text>
  </g>
  <text x="460" y="722" font-size="12" fill="#616161" text-anchor="middle">Жовта крапка — вивід 1 DFPlayer (VCC). Порядок виводів DS3231 різний у різних плат — звіряйте з написами на модулі. Кнопок у схемі немає.</text>
</svg>
